# Rocket Race on a DigitalOcean Droplet: the game server + Caddy for HTTPS.
#
# Player accounts live in a SQLite file in the rocket-data volume (App Platform has no disk
# that survives restarts, which is why this runs on a Droplet).
#
# Settings go in a .env file next to this one (never commit it):
#   SITE_ADDRESS=164-90-1-2.sslip.io     # or your own domain
#   SMTP_HOST=... SMTP_PORT=587 SMTP_USER=... SMTP_PASS=... MAIL_FROM=... REPORT_EMAIL=...
#
# Deploy / update from your PC:   bash deploy/deploy.sh <droplet-ip>
# On the server:                  cd /opt/rocket-race && docker compose up -d --build
# Admins:   docker compose exec game node server/admins.js add <username>
# Tickets:  https://<SITE_ADDRESS>/admin
# Back up the database now and then:
#   docker compose cp game:/data/rocket-race.db ./rocket-race-backup.db
services:
  game:
    build: .
    restart: unless-stopped
    expose:
      - "8080"                    # only reachable through Caddy, not from the internet
    environment:
      TRUST_PROXY: "1"            # behind Caddy: rate limits use the real client IP
      # Email for password reset codes (and report forwarding): any SMTP provider.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Rocket Race <no-reply@example.com>}
      REPORT_EMAIL: ${REPORT_EMAIL:-}
    volumes:
      - rocket-data:/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - game

volumes:
  rocket-data:
  caddy-data:
  caddy-config:
