# DigitalOcean App Platform spec for Rocket Race (NOT deployed yet).
# When multiplayer is ready: App Platform -> Create App -> GitHub repo, or
#   doctl apps create --spec .do/app.yaml
# Update `repo` if the GitHub repository gets renamed.
name: rocket-race
region: nyc
services:
  - name: game
    github:
      repo: lukebelden/rocket-dodge
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1  # rooms live in memory, so keep a single instance
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    routes:
      - path: /
